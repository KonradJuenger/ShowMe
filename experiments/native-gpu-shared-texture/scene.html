<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShowMe shared-texture native scene</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: Arial, Helvetica, sans-serif; color: white; background: #14213d; }
  #generated { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .grid {
    position: absolute; inset: 0; opacity: .24;
    background-image:
      linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: translateZ(0);
  }
  .card {
    position: absolute; left: 8%; top: 13%; width: 62%; padding: 5.5% 5%;
    border-radius: 42px;
    background: rgba(17, 24, 39, .58);
    box-shadow: 0 36px 100px rgba(0,0,0,.42), inset 0 0 0 1px rgba(255,255,255,.25);
    transform: rotate(-2deg);
  }
  h1 { margin: 0 0 .22em; font-size: clamp(64px, 8vw, 144px); line-height: .88; letter-spacing: -.055em; }
  p { margin: 0; width: 70%; font-size: clamp(24px, 2.3vw, 46px); line-height: 1.18; opacity: .82; }
  .pill {
    position: absolute; right: 8%; bottom: 13%; padding: 24px 34px;
    border-radius: 999px; background: rgba(255,255,255,.84); color: #111827;
    box-shadow: 0 18px 44px rgba(0,0,0,.3);
    font-weight: 700; font-size: clamp(20px, 1.7vw, 34px);
    animation: float 1.9s ease-in-out infinite alternate;
  }
  @keyframes float { to { transform: translateY(-38px) rotate(3deg); opacity: .72; } }
  .orb {
    position: absolute; width: 18vw; height: 18vw; right: 11%; top: 8%;
    border-radius: 50%; background: rgba(255,255,255,.3);
    filter: blur(1px); box-shadow: inset 0 0 80px rgba(255,255,255,.28);
    animation: pulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes pulse { to { transform: scale(.72); opacity: .3; } }
</style>
</head>
<body>
  <canvas id="generated"></canvas>
  <div class="grid"></div>
  <div class="orb"></div>
  <section class="card">
    <h1>Chromium<br />native scene</h1>
    <p>Animated CSS background, native text, rounded geometry, opacity and shadow. No ShowMe GPU reconstruction.</p>
  </section>
  <div class="pill">shared texture source</div>
<script src="scene.js"></script>
</body>
</html>
