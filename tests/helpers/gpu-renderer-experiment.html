<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ShowMe general GPU renderer experiment</title>
  </head>
  <body>
    <script type="module">
      import "/src/presentation.css";
      import "/src/style.css";
      import "/src/frame.css";
      const { mountGpuRendererHarness } =
        await import("/tests/helpers/gpuRendererHarness.tsx");
      window.mountGpuRendererHarness = mountGpuRendererHarness;
      const { verifyGpuSemantics, verifyGpuVideo } =
        await import("/tests/helpers/gpuRendererVerification.ts");
      window.verifyGpuSemantics = verifyGpuSemantics;
      window.verifyGpuVideo = verifyGpuVideo;
      const params = new URLSearchParams(location.search);
      const benchmark = params.has("benchmark");
      window.gpuRendererExperiment = await mountGpuRendererHarness({
        width: Number(params.get("width")) || (benchmark ? 1920 : 640),
        height: Number(params.get("height")) || (benchmark ? 1080 : 360),
        pixelRatio: Number(params.get("dpr")) || 1,
        reference: !params.has("noReference"),
      });
    </script>
  </body>
</html>
