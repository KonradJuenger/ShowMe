name: Shared root validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Focused storage tests
        env:
          SHOWME_TEST_FILES: '["tests/feature/persistence/library-lifecycle.test.ts","tests/feature/persistence/package-options.test.ts"]'
        run: npx vitest run
      - name: Persistence feature suite
        run: xvfb-run -a npm run test:feature -- persistence
      - name: Desktop IPC storage contract
        env:
          SHOWME_TEST_FILES: '["tests/release/desktop-ipc.spec.ts"]'
        run: xvfb-run -a npx playwright test --config playwright.electron.config.ts
