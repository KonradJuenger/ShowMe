name: Build binaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      # Personal distribution: ad-hoc signed, without Apple notarization.
      - name: Package macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false '-c.mac.artifactName=ShowMe-${version}-mac-${arch}.${ext}'
      - name: Package Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis portable --${{ matrix.arch }} --publish never '-c.nsis.artifactName=ShowMe-${version}-windows-${arch}-setup.${ext}' '-c.portable.artifactName=ShowMe-${version}-windows-${arch}-portable.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload macOS DMG
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          path: release/ShowMe-*-mac-${{ matrix.arch }}.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS ZIP
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          path: release/ShowMe-*-mac-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          path: release/ShowMe-*-windows-${{ matrix.arch }}-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows portable app
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          path: release/ShowMe-*-windows-${{ matrix.arch }}-portable.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
