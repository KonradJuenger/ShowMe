name: Browser-native renderer branch verification
on:
  push:
    branches:
      - experimental/browser-native-renderer
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify test statistics are current
        run: npm run test:stats && git diff --exit-code tests/stats.json
      - run: npm run test:audit
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log-${{ github.sha }}
          path: typecheck.log
          if-no-files-found: ignore
      - name: Architecture and composition unit regressions
        run: npx vitest run
        env:
          SHOWME_TEST_FILES: '["tests/feature/effects/renderer-architecture.test.ts","tests/feature/effects/composition-plan.test.ts"]'
      - run: npx playwright install --with-deps chromium
      - name: SceneTexture and generated shader browser regressions
        run: npx playwright test --config playwright.config.ts --output test-results-scene-texture
        env:
          SHOWME_TEST_FILES: '["tests/feature/effects/render-sampling.spec.ts","tests/feature/effects/mixed-compositing.spec.ts"]'
      - name: Audience rendering regression
        run: npx playwright test --config playwright.config.ts --output test-results-audience
        env:
          SHOWME_TEST_FILES: '["tests/feature/presenter/audience-navigation.spec.ts"]'
      - name: Browser-native CSS and Motion product contracts
        run: >-
          xvfb-run -a npx playwright test
          --config playwright.electron.config.ts
          --output test-results-native-product
          --grep "browser-native CSS glass|Move Scale Rotate and Fade|Presence enter and exit|later foreground content"
        env:
          SHOWME_TEST_FILES: '["tests/feature/effects/native-composition.spec.ts"]'
      - name: Legacy compositor diagnostic
        continue-on-error: true
        run: >-
          xvfb-run -a npx playwright test
          --config playwright.electron.config.ts
          --output test-results-legacy-compositor
          --grep-invert "browser-native CSS glass|Move Scale Rotate and Fade|Presence enter and exit|later foreground content|generated shader layers"
        env:
          SHOWME_TEST_FILES: '["tests/feature/effects/native-composition.spec.ts"]'
